<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>МЗ-21 лекция 2 Column</title>
		<meta name="keywords" content="HTML">
		<meta name="description" content="HMTL">
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
		<link rel="stylesheet" href="style/menu.css">
		<link rel="stylesheet" href="style/footer.css">
		<link rel="stylesheet" href="style/container.css">
		<style>
			@font-face {
			  font-family: Roboto-Light;
			  src: url(Roboto-Light.ttf);
			}
			button{
				background-color: #3d4257;
				color: white;
				width: 50px;
				height: 25px;
				border: none;
				border-radius: 5px;
			}
			#calculatorDisplay{
				height: 22px;
				font-family: Roboto-Light;
			}
			#calculator{
				background-color: #1A2033;
				color: white;
				padding-top: 20px;
				border-radius: 5px;
				font-family: Roboto-Light;
			}

			.result{
				background-color: #4CC2FF;
				color: #153647;
				transition: 0.5s;
			}
			.result:hover{
				background-color: #77D1FF;
				cursor: pointer;
				transition: 0.5s;
			}

			.number{
				background-color: #363A4C;
				transition: 0.5s;
			}
			.number:hover{
				background-color: #454A61;
				cursor: pointer;
				transition: 0.5s;
			}
			.edit, .arithmetic{
				background-color: #2D3146;
				transition: 0.5s;
			}
			.edit:hover, .arithmetic:hover{
				background-color: #393E58;
				cursor: pointer;
				transition: 0.5s;
			}
			.changeSign{
				background-color: #363A4C;
				transition: 0.5s;
			}
			.changeSign:hover{
				background-color: #454A61;
				cursor: pointer;
				transition: 0.5s;
			}
		</style>
		<script>
			15;
		</script>
		
	</head>
	<body>
		<div id="header">
			<h2 id="EDUname"> 
				ВСП Харківський фаховий коледж<br>
				інформаційних технологій<br>
				Національного аерокосмічного<br>
				університету "ХАІ"<br>
			</h2>
			<div id="menu">
				<a href="index.html">index</a>
				<a href="css.html">CSS</a>
				<a href="table.html">table</a>
				<a href="div.html">div</a>
				<a href="menu.html">menu</a>
				<a href="2Column.html">2 Column</a>
				<a href="form.html">Form</a>
				<a href="js-basic.html">JS</a>
				<a href="calculator.html">calculator</a>
				<a href="calculator2.html" class="active" >calculator2</a>
			</div>
		</div>
		
<div id="container">
    <div id="sidebar">
        <h1>calculator</h1>
    </div>
    <div id="content">
        <table id="calculator">
            <tr>
                <td colspan="4">
                    <div id="calculatorDisplay"></div>
                </td>
            </tr>
            <tr>
                <td colspan="4">
                    <div id="calculatorStatus"></div>
                </td>
            </tr>
            <tr>
            	<td>
                    <button class="edit" value="percent" title='Percentage'>%</button>
                </td>
            	<td>
                    <button class="edit" value="ce" title='Clear Last Number'>ce</button>
                </td>
                <td>
                    <button class="edit" value="c" title='Clear All'>c</button>
                </td>
                
                <td>
                <!-- <td colspan="2"> -->
                    <button class="edit" value="<-" title='Clear Last Symbol'><-</button>
                </td>
            </tr>
            <tr>
            	<td>
				    <button class="edit" value="inverse" title='Inverse'>¹/X</button>
				</td>
            	<td>
				    <button class="edit" value="square" title='Square'>X²</button>
				</td>
				<td>
				    <button class="edit" value="sqrt" title='Square Root'>²√X</button>
				</td>
                
                <td>
                <!-- <td colspan="2"> -->
                    <button class="arithmetic" value="/">÷</button>
                </td>
            </tr>
            <tr>
                <td>
                	<button class="number" value="7">7</button>
                </td>
                <td>
                	<button class="number" value="8">8</button>
                </td>
                <td>
                	<button class="number" value="9">9</button>
                </td>
                <td>
                	<button class="arithmetic" value="*">*</button>
                </td>
            </tr>
            <tr>
                <td>
                	<button class="number" value="4">4</button>
                </td>
                <td>
                	<button class="number" value="5">5</button>
                </td>
                <td>
                	<button class="number" value="6">6</button>
                </td>
                <td>
                	<button class="arithmetic" value="-">-</button>
                </td>
            </tr>
            <tr>
                <td>
                	<button class="number" value="1">1</button>
                </td>
                <td>
                	<button class="number" value="2">2</button>
                </td>
                <td>
                	<button class="number" value="3">3</button>
                </td>
                <td>
                	<button class="arithmetic" value="+">+</button>
                </td>
            </tr>
            <tr>
                <td>
                	<button class="edit changeSign" value="changeSign">+/-</button>

                </td>
                <td>
                	<button class="number" value="0">0</button>
                </td>
                <td>
                	<button class="number" value=".">.</button>
                </td>
                <td colspan="3">
                	<button class="result" value="=">=</button>
                </td>
            </tr>
        </table>
    </div>
</div>

	</body>
